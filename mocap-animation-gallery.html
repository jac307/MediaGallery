      color: #222;
    }
    h1 {
      text-align: left;
    }
    .banner {
      width: 100%;
      height: auto;
      margin: 20px 0 40px 0;
      display: block;
    }
    h2 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 5px;
    }
    .student {
      margin-bottom: 60px;
    }
    .main-image {
      max-width: 100%;
      height: auto;
      margin: 10px 0;
    }
    .videos {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    video {
      width: 100%;
      max-width: 60%;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .gallery img {
      width: 30%;
      height: auto;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
