<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Project Gallery 2026</title>
  <link rel="stylesheet" href="css/gallery-2026-photo.css">
</head>

<body>

  <h1 style="color: #722F37;">Arts at McMaster – Teen Summer Intensives - 2026</h1>
  <h1>Photographic Foundations</h1>
  <h1>🖼️ Student Gallery</h1>

  <div class="student">
    <h2>Student 1</h2>
    <!-- GIFS -->
    <h3>Technical Cards</h3>
    <div class="gif-strip">
      <img src="sc-26-photo/gifs/GIF_Student-1_01.gif" alt="Animated GIF 1">
      <img src="sc-26-photo/gifs/GIF_Student-1_02.gif" alt="Animated GIF 2">
      <img src="sc-26-photo/gifs/GIF_Student-1_03.gif" alt="Animated GIF 3">
      <img src="sc-26-photo/gifs/GIF_Student-1_04.gif" alt="Animated GIF 4">
      <img src="sc-26-photo/gifs/GIF_Student-1_05.gif" alt="Animated GIF 5">
    </div>
    <!-- Mini-Project 1 -->
    <h3>Landscape Series</h3>
    <div class="gallery">
      <img src="sc-26-photo/Landscape/LS_Student-1_01.jpg" alt="Photo 1">
      <img src="sc-26-photo/Landscape/LS_Student-1_02.jpg" alt="Photo 2">
      <img src="sc-26-photo/Landscape/LS_Student-1_03.jpg" alt="Photo 3">
      <img src="sc-26-photo/Landscape/LS_Student-1_04.jpg" alt="Photo 4">
      <img src="sc-26-photo/Landscape/LS_Student-1_05.jpg" alt="Photo 5">
    </div>
    <!-- Mini-Project 2 -->
    <h3>Photo Film</h3>
    <div class="gallery">
      <img src="sc-26-photo/PhotoFilm/PF_Student-1_01.jpg" alt="Photo 1">
      <img src="sc-26-photo/PhotoFilm/PF_Student-1_02.jpg" alt="Photo 2">
      <img src="sc-26-photo/PhotoFilm/PF_Student-1_03.jpg" alt="Photo 3">
      <img src="sc-26-photo/PhotoFilm/PF_Student-1_04.jpg" alt="Photo 4">
      <img src="sc-26-photo/PhotoFilm/PF_Student-1_05.jpg" alt="Photo 5">
    </div>
    <div class="video">
      <video controls>
        <source src="sc-26/videos/Student-1.mp4" type="video/mp4">
      </video>
    </div>
  </div>




  <!-- Lightbox Pop-out Window -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close image">&times;</button>
  <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous image">&#10094;</button>

  <img class="lightbox-content" id="lightboxImage" src="" alt="">

  <button class="lightbox-next" id="lightboxNext" aria-label="Next image">&#10095;</button>

  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
  const lightbox = document.getElementById("lightbox");
  const lightboxImage = document.getElementById("lightboxImage");
  const lightboxCaption = document.getElementById("lightboxCaption");
  const lightboxClose = document.getElementById("lightboxClose");
  const lightboxPrev = document.getElementById("lightboxPrev");
  const lightboxNext = document.getElementById("lightboxNext");

  let currentGallery = [];
  let currentIndex = 0;

  document.querySelectorAll(".gallery").forEach((gallery) => {
    const images = Array.from(gallery.querySelectorAll("img"));

    images.forEach((image, index) => {
      image.addEventListener("click", () => {
        currentGallery = images;
        currentIndex = index;
        openLightbox();
      });
    });
  });

  function openLightbox() {
    const currentImage = currentGallery[currentIndex];

    lightboxImage.src = currentImage.src;
    lightboxImage.alt = currentImage.alt;
    lightboxCaption.textContent = currentImage.alt;

    lightbox.classList.add("active");
  }

  function closeLightbox() {
    lightbox.classList.remove("active");
    lightboxImage.src = "";
    lightboxImage.alt = "";
    lightboxCaption.textContent = "";
  }

  function showPreviousImage() {
    currentIndex =
      (currentIndex - 1 + currentGallery.length) % currentGallery.length;
    openLightbox();
  }

  function showNextImage() {
    currentIndex =
      (currentIndex + 1) % currentGallery.length;
    openLightbox();
  }

  lightboxClose.addEventListener("click", closeLightbox);
  lightboxPrev.addEventListener("click", showPreviousImage);
  lightboxNext.addEventListener("click", showNextImage);

  lightbox.addEventListener("click", (event) => {
    if (event.target === lightbox) {
      closeLightbox();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (!lightbox.classList.contains("active")) return;

    if (event.key === "Escape") {
      closeLightbox();
    }

    if (event.key === "ArrowLeft") {
      showPreviousImage();
    }

    if (event.key === "ArrowRight") {
      showNextImage();
    }
  });
</script>

</body>
</html>
