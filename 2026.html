<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Project Gallery 2026</title>
  <link rel="stylesheet" href="css/gallery-2026.css">
  <script
  type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>
</head>

<body>

  <h1 style="color: #722F37;">Arts at McMaster – Teen Summer Intensives - 2026</h1>
  <h1>Animation and Motion Capture</h1>
  <h1>🖼️ Student Gallery</h1>

  <img src="sc-26/general-banner.png" alt="Class Banner" class="banner">

  <div class="student">
    <h2>Student 1</h2>
    <!-- Blender image -->
    <img src="sc-26/blender/AnnaMarie.png" class="main-image">
    <!-- 3D viewer -->
    <div class="model-viewer-box">
      <model-viewer
        src="sc-26/models/AnnaMarie.glb"
        alt="Interactive 3D character by Student 1"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="0.6">
      </model-viewer>
     </div>
     <!-- Videos -->
    <div class="videos">
      <video controls>
        <source src="sc-25/videos/Alex-1.mp4" type="video/mp4">
      </video>
      <video controls>
        <source src="sc-25/videos/Alex-2.mp4" type="video/mp4">
      </video>
    </div>
    <!-- Gallery -->
    <div class="gallery">
      <img src="sc-25/images/Alex-1.jpg" alt="Photo 1">
      <img src="sc-25/images/Alex-2.jpg" alt="Photo 2">
      <img src="sc-25/images/Alex-3.jpg" alt="Photo 3">
      <img src="sc-25/images/Alex-4.jpg" alt="Photo 4">
      <img src="sc-25/images/Alex-5.jpg" alt="Photo 5">
      <img src="sc-25/images/Alex-6.jpg" alt="Photo 6">
      <img src="sc-25/images/Alex-7.jpg" alt="Photo 7">
      <img src="sc-25/images/Alex-8.jpg" alt="Photo 8">
      <img src="sc-25/images/Alex-9.jpg" alt="Photo 9">
    </div>
  </div>


</body>
</html>
