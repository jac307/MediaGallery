<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Project Gallery 2026</title>
  <link rel="stylesheet" href="css/gallery-2026.css">
  <script
  type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>
</head>

<script>
  function matchModelViewerHeightToImage() {
    const rows = document.querySelectorAll(".student-3d-row");

    rows.forEach(row => {
      const image = row.querySelector(".reference-image-box img");
      const viewerBox = row.querySelector(".model-viewer-box");

      if (image && viewerBox && window.innerWidth > 600) {
        viewerBox.style.height = image.offsetHeight + "px";
      }
    });
  }

  window.addEventListener("load", matchModelViewerHeightToImage);
  window.addEventListener("resize", matchModelViewerHeightToImage);
</script>

<body>
  <h1 style="color: #722F37;">Arts at McMaster – Teen Summer Intensives - 2026</h1>
  <h1>Animation and Motion Capture</h1>
  <h1>🖼️ Student Gallery</h1>
  <img src="sc-26/general-banner.png" alt="Class Banner" class="banner">


  <!-- ////////////////////// -->
  <!-- Student 1 Work -->
  <div class="student">
    <h2>Student 1</h2>
    <!-- Blender image -->
    <img src="sc-26/blender/student-01.png" class="main-image">

    <!-- 3D viewer + Environment Photo -->
    <div class="student-3d-row">
      <div class="model-viewer-box">
        <model-viewer
        src="sc-26/models/student-01.glb"
        alt="Interactive 3D scene by Student 1"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="0.6">
      </model-viewer>
      </div>
      <div class="reference-image-box">
        <img
        src="sc-26/environments/student-1-environment.png"
        alt="Rendered image of Student 1 environment"
        >
      </div>
    </div>

    <!-- Videos -->
    <div class="videos">
      <video controls>
        <source src="sc-26/videos/student-01-1.mp4" type="video/mp4">
      </video>
      <video controls>
        <source src="sc-26/videos/student-01-2.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Image Gallery -->
     <div class="gallery">
      <img src="sc-26/images/student-1-01.png" alt="Photo 1">
      <img src="sc-26/images/student-1-02.png" alt="Photo 2">
      <img src="sc-26/images/student-1-03.png" alt="Photo 3">
      <img src="sc-26/images/student-1-04.png" alt="Photo 4">
      <img src="sc-26/images/student-1-05.png" alt="Photo 5">
      <img src="sc-26/images/student-1-06.png" alt="Photo 6">
      <img src="sc-26/images/student-1-07.png" alt="Photo 7">
      <img src="sc-26/images/student-1-08.png" alt="Photo 8">
      <img src="sc-26/images/student-1-09.png" alt="Photo 9">
    </div>
  </div>
  <!-- End of Student 1 -->
